name: Refresh catalyst board

on:
  # Triggered by Vercel Cron, not by GitHub's own scheduler.
  #
  # GitHub's `schedule` does fire, but it drifts badly: an 11:23 UTC cron
  # landed at 15:29 on its first successful day, and two earlier days appeared
  # to skip entirely. Vercel's scheduler is dependable, so it keeps the clock
  # and calls workflow_dispatch through api/refresh.js. The work still happens
  # here, where there is no function timeout to fight.
  workflow_dispatch:

# Never let two refreshes race for the database.
concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The job takes ~10 minutes warm; the cap exists to catch a hang, not to
    # constrain normal runs. GitHub's own ceiling is 6 hours.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # SEC throttles hard and financials only move when a 10-Q lands, so a
      # restored cache turns the slowest step into seconds.
      - name: Restore EDGAR cache
        uses: actions/cache@v6
        with:
          path: data/cache
          key: edgar-cache-${{ github.run_id }}
          restore-keys: edgar-cache-

      - name: Refresh
        env:
          # SEC requires a descriptive User-Agent with contact details.
          BIOCATALYST_SEC_UA: ${{ secrets.BIOCATALYST_SEC_UA }}
        run: python -m biocatalyst.cli refresh

      - name: Export static board
        run: python -m biocatalyst.cli export

      - name: Sanity-check the export
        run: |
          python - <<'PY'
          import json, sys, datetime as dt
          d = json.load(open("web/board.json"))
          n = len(d["rows"])
          print(f"{n} rows, generated {d['generated']}")
          # Refuse to publish an empty or obviously broken board.
          if n < 25:
              sys.exit(f"only {n} rows — refusing to publish")
          age = dt.datetime.now() - dt.datetime.fromisoformat(d["generated"])
          if age.total_seconds() > 3600:
              sys.exit("board.json is stale — export did not run")
          PY

      # The logs only ever grow. If one got shorter, the refresh started from
      # an empty table and is about to overwrite history -- stop instead.
      - name: Refuse to shrink the forward logs
        run: |
          for f in logs/verdicts.csv logs/sentiment.csv; do
            before=$(git show HEAD:"$f" 2>/dev/null | wc -l || echo 0)
            after=$(wc -l < "$f" 2>/dev/null || echo 0)
            echo "$f: $before -> $after lines"
            if [ "$after" -lt "$before" ]; then
              echo "::error::$f shrank from $before to $after lines"; exit 1
            fi
          done

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/board.json logs/
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "data: refresh catalyst board $(date -u +%Y-%m-%d)"
            git push
          fi
